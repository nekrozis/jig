name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            exit 1
          }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o jig.exe .
          $hash = (Get-FileHash -Algorithm SHA256 jig.exe).Hash.ToLower()
          "sha256  $hash  jig.exe" | Set-Content -Encoding ascii jig.exe.sha256
          Get-Content jig.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jig-windows-amd64
          path: |
            jig.exe
            jig.exe.sha256
          if-no-files-found: error